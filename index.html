<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayTV - Titan2022_XD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<style>
:root{--bg:#f3f1ec;--surface:#fff;--ink:#1d2433;--muted:#5d6678;--line:#d9d5ca;--accent:#1f5fd6;--danger:#c0392b;--discord:#5865F2}
@media (prefers-color-scheme:dark){:root{--bg:#171b26;--surface:#222838;--ink:#eef0f5;--muted:#a3abbd;--line:#38405a;--accent:#7fa8ff;--danger:#ff7b6b;--discord:#5865F2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.bars{height:14px;background:linear-gradient(90deg,#c8c8c8 0 14.28%,#d8c61a 0 28.56%,#18bfc9 0 42.84%,#21b04b 0 57.12%,#c52fc5 0 71.4%,#d63030 0 85.68%,#2a3fc9 0)}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:1.6rem}
.subhead{color:var(--muted);font-size:0.95rem;margin:0 0 14px}

/* Banner Informativo y Creador */
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.info-card .details{flex:1;min-width:260px}
.info-card h2{margin:0 0 4px;font-size:1.2rem;color:var(--ink)}
.info-card p{margin:2px 0;font-size:0.9rem;color:var(--muted)}
.info-card .creator{font-weight:700;color:var(--accent)}

/* Botón de Discord */
.btn-discord{display:inline-flex;align-items:center;gap:8px;background:var(--discord);color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:600;font-size:0.95rem;transition:transform 0.2s, opacity 0.2s}
.btn-discord:hover{opacity:0.9;transform:translateY(-1px)}
.btn-discord svg{width:20px;height:20px;fill:currentColor}

/* Contenedor del reproductor / iframe */
.player-container{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;display:block}
video, iframe{width:100%;height:100%;border:none;display:block}
#now{margin:8px 0 0;color:var(--muted);font-size:.95rem;min-height:1.4em}
#now.err{color:var(--danger)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 12px}
button{font:inherit;color:var(--ink);cursor:pointer}
.tab{padding:7px 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ch{width:100%;display:block;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:hidden;padding:0}
.ch img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.ch span{display:block;padding:8px 10px;font-weight:600}
.ch[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
</style>
</head>
<body>
<div class="bars"></div>
<div class="wrap">
  <h1>TV Gratis Argentina</h1>
  <p class="subhead">Fácil de ver desde tu celular, tablet y PC</p>

  <!-- Sección de Créditos y Discord -->
  <div class="info-card">
    <div class="details">
      <h2>ARG | IPTV</h2>
      <p>Creador: <span class="creator">Titan2022_XD</span></p>
      <p>Disfrutá de los mejores canales en vivo y eventos deportivos gratis.</p>
    </div>
    <a href="https://discord.gg/ywzJerM74H" target="_blank" rel="noopener" class="btn-discord">
      <svg viewBox="0 0 127.14 96.36"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.68 1.75 1.36 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15zM42.45 65.69c-6.58 0-12-6.04-12-13.43s5.3-13.43 12-13.43c6.73 0 12.05 6.09 12 13.43 0 7.39-5.3 13.43-12 13.43zm42.24 0c-6.58 0-12-6.04-12-13.43s5.3-13.43 12-13.43c6.73 0 12.05 6.09 12 13.43 0 7.39-5.27 13.43-12 13.43z"/></svg>
      Unirse a nuestro servidor de Discord
    </a>
  </div>

  <div class="player-container" id="player-box">
    <video id="v" controls playsinline></video>
  </div>
  <p id="now">Elegí un canal para empezar.</p>
  <div class="tabs" id="tabs" role="group" aria-label="Categorías"></div>
  <ul class="list" id="list"></ul>
</div>

<script>
/* ============ CANALES ============ */
const LOGO_LPF="https://substackcdn.com/image/fetch/$s_!eL_V!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fadc76a2d-b0c6-47de-884b-f23006a418a8_1000x750.jpeg";

const GRUPOS=[
  {
    nombre:"LPF Play",
    imagen:LOGO_LPF,
    esIframe: false,
    canales:[
      ["LPF 1","http://cdn.tvar.io/lpf1.m3u8"],
      ["LPF 2","http://cdn.tvar.io/lpf2.m3u8"],
      ["LPF 3","http://cdn.tvar.io/lpf3.m3u8"],
      ["LPF 4","http://cdn.tvar.io/lpf4.m3u8"],
      ["LPF 5","http://cdn.tvar.io/lpf5.m3u8"],

      ["LPF 11","http://cdn.tvar.io/lpf11.m3u8"],
      ["LPF 12","http://cdn.tvar.io/lpf12.m3u8"],
      ["LPF 13","https://emitiendoenvivo.com/lpf/13.m3u8"],
      ["LPF 14","http://cdn.tvar.io/lpf14.m3u8"],
      ["LPF 15","http://cdn.tvar.io/lpf15.m3u8"],
      ["LPF 16","http://cdn.tvar.io/lpf16.m3u8"],
      ["LPF 17","http://cdn.tvar.io/lpf17.m3u8"],
      ["LPF 18","http://cdn.tvar.io/lpf18.m3u8"]
    ]
  },
  {
    nombre:"Canales Argentinos 🇦🇷",
    imagen:"",
    esIframe: false,
    canales:[
      ["A24", "http://45.134.141.161:2200/ARG/A24/index.m3u8"],
      ["America TV", "http://nexusconnects.org/play/live.php?mac=00:1A:79:A2:B8:2E&stream=1090609&extension=m3u8"],
      ["C5N", "http://nexusconnects.org/play/live.php?mac=00:1A:79:A2:B8:2E&stream=1090586&extension=m3u8"],
      ["Telefe SD", "http://181.66.249.246:8000/play/a0k7/index.m3u8"],
      ["Telefe HD", "http://nexusconnects.org/play/live.php?mac=00:1A:79:A2:B8:2E&stream=1090561&extension=m3u8"],
      ["El Trece", "https://livetrx01.vodgc.net/eltrece/index.m3u8"],
      ["Todo Noticias", "https://live-01-01-tn.vodgc.net/TN_DAI_Beta/index.m3u8"]
    ]
  },
  {

    imagen:"",
    esIframe: true,
    canales:[
      ["ESPN 1", "https://la18hd.su/vivo/canales.php?stream=espn"],
      ["ESPN 2", "https://la18hd.su/vivo/canales.php?stream=espn2"],
      ["ESPN 3", "https://la18hd.su/vivo/canales.php?stream=espn3"],
      ["ESPN 4", "https://la18hd.su/vivo/canales.php?stream=espn4"],
      ["ESPN 5", "https://la18hd.su/vivo/canales.php?stream=espn5"],
      ["ESPN 6", "https://la18hd.su/vivo/canales.php?stream=espn6"],
      ["ESPN 7", "https://la18hd.su/vivo/canales.php?stream=espn7"],
      ["ESPN Premium", "https://streamtp99a.sbs/global1.php?stream=espnpremium"],
      ["ESPN Premium Op. 1", "https://la18hd.su/vivo/canales.php?stream=espnpremium"],
      ["TyC Sports", "https://la18hd.su/vivo/canales.php?stream=tycsports"]
    ]
  }
];
/* ================================= */

const $=id=>document.getElementById(id);
let grupo=0,actual=null,hls=null;

function reproducir(g,c){
  const box=$("player-box"),n=$("now"),[nombre,url]=c;
  actual=url;
  n.className="";
  n.textContent="Cargando "+nombre+"…";

  if(hls){hls.destroy();hls=null}

  if(g.esIframe){
    box.innerHTML='<iframe src="'+url+'" allowfullscreen></iframe>';
    n.textContent="Reproduciendo: "+g.nombre+" · "+nombre;
  } else {
    box.innerHTML='<video id="v" controls playsinline></video>';
    const v=$("v");
    const falla=()=>{n.className="err";n.textContent="No se pudo reproducir "+nombre+". Probá con otro canal."};
    
    if(window.Hls&&Hls.isSupported()){
      hls=new Hls();hls.loadSource(url);hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{});n.textContent="Reproduciendo: "+g.nombre+" · "+nombre});
      hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)falla()});
    }else if(v.canPlayType("application/vnd.apple.mpegurl")){
      v.src=url;v.onerror=falla;v.onplaying=()=>{n.textContent="Reproduciendo: "+g.nombre+" · "+nombre};v.play().catch(()=>{});
    }else falla();
  }
  dibujarLista();
}

function dibujar(){
  const t=$("tabs");t.innerHTML="";
  GRUPOS.forEach((g,i)=>{
    const b=document.createElement("button");b.className="tab";b.textContent=g.nombre;
    b.setAttribute("aria-pressed",i===grupo);b.onclick=()=>{grupo=i;dibujar()};
    t.appendChild(b);
  });
  dibujarLista();
}

function dibujarLista(){
  document.querySelectorAll(".tab").forEach((b,i)=>b.setAttribute("aria-pressed",i===grupo));
  const g=GRUPOS[grupo],l=$("list");l.innerHTML="";
  g.canales.forEach(c=>{
    const li=document.createElement("li"),b=document.createElement("button");b.className="ch";
    if(c[1]===actual)b.setAttribute("aria-current","true");
    if(g.imagen){const im=document.createElement("img");im.src=g.imagen;im.alt="";im.loading="lazy";im.onerror=()=>im.remove();b.appendChild(im)}
    const s=document.createElement("span");s.textContent=c[0];b.appendChild(s);
    b.onclick=()=>reproducir(g,c);li.appendChild(b);l.appendChild(li);
  });
}
dibujar();
</script>
</body>
</html>
